<!DOCTYPE html>
<html lang="fr-CA" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affectation — Forces propres CG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  /* palette relevée sur l'interface Somtech (constructiongauthier.app) */
  --green:#618E43;--green-deep:#4C7334;--green-soft:#EEF2EB;--green-ring:#C3D6B4;
  --bg:#F9FAFB;--surface:#FFFFFF;--surface-2:#F3F4F6;
  --line:#E5E7EB;--line-strong:#D1D5DB;
  --ink:#111827;--ink-2:#1F2937;--muted:#6B7280;--muted-2:#9CA3AF;
  --amber-bg:#FFFBEB;--amber-bd:#FDE68A;--amber-fg:#B45309;
  --teal-bg:#CCFBF1;--teal-fg:#0F766E;
  --violet-bg:#EDE9FE;--violet-fg:#6D28D9;
  --red:#B91C1C;--red-bg:#FEF2F2;--red-bd:#FECACA;
  --ok:#15803D;
  --ferie-bg:#FEF3C7;--ferie-fg:#B45309;--vac-bg:#DBEAFE;--vac-fg:#1D4ED8;
  --sub-bg:#F3F4F6;--sub-fg:#4B5563;--sub-bd:#D1D5DB;
  --r:8px;--r-lg:12px;--col:84px;--poolw:214px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink-2);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --green:#8FBF6E;--green-deep:#A6D083;--green-soft:#1D2A16;--green-ring:#335024;
  --bg:#0F1115;--surface:#171A1F;--surface-2:#1F242B;--line:#2A2F37;--line-strong:#3A414B;
  --ink:#F3F4F6;--ink-2:#E5E7EB;--muted:#9CA3AF;--muted-2:#6B7280;
  --amber-bg:#2C2310;--amber-bd:#5A4715;--amber-fg:#FCD34D;
  --teal-bg:#10322C;--teal-fg:#5EEAD4;--violet-bg:#241F3B;--violet-fg:#C4B5FD;
  --red:#F87171;--red-bg:#2A1515;--red-bd:#4C2020;--ok:#4ADE80;
  --ferie-bg:#2C2310;--ferie-fg:#FCD34D;--vac-bg:#15223B;--vac-fg:#93C5FD;
  --sub-bg:#1F242B;--sub-fg:#9CA3AF;--sub-bd:#3A414B;}}
:root[data-theme="dark"]{
  --green:#8FBF6E;--green-deep:#A6D083;--green-soft:#1D2A16;--green-ring:#335024;
  --bg:#0F1115;--surface:#171A1F;--surface-2:#1F242B;--line:#2A2F37;--line-strong:#3A414B;
  --ink:#F3F4F6;--ink-2:#E5E7EB;--muted:#9CA3AF;--muted-2:#6B7280;
  --amber-bg:#2C2310;--amber-bd:#5A4715;--amber-fg:#FCD34D;
  --teal-bg:#10322C;--teal-fg:#5EEAD4;--violet-bg:#241F3B;--violet-fg:#C4B5FD;
  --red:#F87171;--red-bg:#2A1515;--red-bd:#4C2020;--ok:#4ADE80;
  --ferie-bg:#2C2310;--ferie-fg:#FCD34D;--vac-bg:#15223B;--vac-fg:#93C5FD;
  --sub-bg:#1F242B;--sub-fg:#9CA3AF;--sub-bd:#3A414B;}

/* ---------- entête d'application ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.hwrap{padding:14px 20px 0}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:9px}
.crumb svg{flex:none}
.htop{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.htop h1{margin:0;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.hsub{font-size:13px;color:var(--muted);margin-top:2px}
.hact{margin-left:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
.tabs button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:var(--r);cursor:pointer;white-space:nowrap;margin-bottom:8px}
.tabs button:hover{color:var(--ink-2);background:var(--surface-2)}
.tabs button.on{background:var(--green-soft);color:var(--green)}

/* ---------- boutons ---------- */
.btn{border:1px solid var(--line-strong);background:var(--surface);color:#374151;font-family:inherit;font-weight:600;font-size:13.5px;border-radius:var(--r);height:36px;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:var(--ink-2)}
.btn:hover{background:var(--surface-2)}
.btn.sq{width:36px;padding:0;justify-content:center;font-size:15px}
.cta{border:1px solid var(--green);border-radius:var(--r);background:var(--green);color:#fff;font-family:inherit;font-weight:600;font-size:13.5px;padding:0 16px;height:36px;cursor:pointer;white-space:nowrap}
.cta:hover{background:var(--green-deep);border-color:var(--green-deep)}
.cta[disabled]{background:var(--line-strong);border-color:var(--line-strong);cursor:not-allowed}

main{padding:14px 20px 32px}

/* ---------- cartes d'indicateurs ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 14px}
.stat .v{font-size:22px;font-weight:700;color:var(--green);line-height:1.1;text-align:right}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px}

/* ---------- barre de contexte ---------- */
.ctxbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ctx{font-size:13px;color:var(--muted)}
.ctxbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13px;height:28px;border-radius:6px;cursor:pointer;padding:0 11px;white-space:nowrap}
.seg button.on{background:var(--green-soft);color:var(--green)}
.ctl-lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}

/* ---------- pastilles ---------- */
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.green{background:var(--green);color:#fff}
.pill.teal{background:var(--teal-bg);color:var(--teal-fg)}
.pill.amber{background:var(--ferie-bg);color:var(--ferie-fg)}
.pill.violet{background:var(--violet-bg);color:var(--violet-fg)}
.pill.gray{background:var(--surface-2);color:var(--muted)}

/* ---------- panneau latéral ---------- */
.dispatch{display:flex;gap:14px;align-items:flex-start}
.pool{flex:none;width:var(--poolw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;position:sticky;top:144px;max-height:calc(100vh - 160px);display:flex;flex-direction:column}
.poolseg{display:flex;gap:2px;background:var(--surface-2);border-radius:var(--r);padding:3px;margin-bottom:10px;flex:none}
.poolseg button{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:11.5px;height:26px;border-radius:6px;cursor:pointer;padding:0 2px;white-space:nowrap}
.poolseg button.on{background:var(--surface);color:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.poolbody{overflow:auto;flex:1;min-height:0}
.pool .sub{font-size:11.5px;color:var(--muted);margin-bottom:9px;line-height:1.4}
.poollist{display:flex;flex-direction:column;gap:6px}
.pw{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;cursor:grab;background:var(--surface);touch-action:none;user-select:none}
.pw:hover{border-color:var(--green-ring);background:var(--green-soft)}
.pwtop{display:flex;align-items:center;gap:5px}
.pwtop b{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;flex:none;line-height:1.6}
.tag.chef{background:var(--green);color:#fff}
.tag.app{background:var(--surface-2);color:var(--muted)}
.tag.eq{background:var(--violet-bg);color:var(--violet-fg)}
.pwtop .free{margin-left:auto;font-size:11px;font-weight:600;color:var(--green);white-space:nowrap;flex:none}
.pwtop .free.none{color:var(--muted-2)}
.pw .dots{display:flex;gap:2px;margin-top:6px}
.pw .dot{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.pw .dot.f{background:var(--green)}.pw .dot.h{background:linear-gradient(90deg,var(--green) 50%,var(--surface-2) 50%)}
.pw.full-busy{opacity:.55}
.pc{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--surface);cursor:grab;touch-action:none;user-select:none}
.pctop{display:flex;align-items:center;gap:6px}
.pctop b{font-size:13px;font-weight:600;color:var(--ink)}
.pctop .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.pc .mem{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.pc .mem .k{color:var(--green);font-weight:700}
.pc .where{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pc .wtag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;color:#fff}
.pc .wtag.none{background:var(--surface-2);color:var(--muted)}
.pc .act{display:flex;gap:6px;margin-top:8px}
.pc .act button{flex:1;border:1px solid var(--line-strong);background:var(--surface);color:#374151;font-family:inherit;font-weight:600;font-size:11.5px;border-radius:6px;height:26px;cursor:pointer}
:root[data-theme="dark"] .pc .act button{color:var(--ink-2)}
.stq{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;font-weight:600;color:var(--muted)}
.stq .pm{width:24px;height:24px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:6px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;line-height:1}
.stq .q{min-width:22px;text-align:center;font-size:13px;font-weight:700;color:var(--ink)}

/* ---------- tableau ---------- */
.boardarea{flex:1;min-width:0;overflow-x:auto;padding-bottom:6px}
.boardinner{min-width:max-content}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:8px}
.wkrow,.dayrow{display:grid;gap:0}
.wkrow .wk{text-align:center;padding:3px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-left:2px solid var(--line-strong)}
.wkrow .wk:first-child{border-left:none}
.dayrow .dh{text-align:center;padding:7px 3px;background:var(--surface);border:1px solid var(--line);border-left:none;font-weight:600;font-size:12.5px;color:var(--ink)}
.dayrow .dh.wkstart{border-left:2px solid var(--line-strong)}
.dayrow .dh:first-child{border-left:1px solid var(--line);border-radius:var(--r) 0 0 var(--r)}
.dayrow .dh:last-child{border-radius:0 var(--r) var(--r) 0}
.dayrow .dh small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.dayrow .dh.today{background:var(--green-soft);color:var(--green)}
.dayrow .dh.ferie{background:var(--ferie-bg);color:var(--ferie-fg)}
.dayrow .dh.vac{background:var(--vac-bg);color:var(--vac-fg)}
.dayrow .dh em{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.ph-in{position:sticky;left:0;width:max-content;display:flex;align-items:center;gap:10px;padding:11px 14px}
.phours{border-bottom:1px solid var(--line)}
.phours .ph-in{padding:0 14px 11px;gap:12px;flex-wrap:wrap}
.caret{border:none;background:transparent;color:var(--muted-2);font-size:11px;cursor:pointer;padding:3px 2px;line-height:1;flex:none;transition:transform .14s ease}
.pblock.closed .caret{transform:rotate(-90deg)}
.pblock.closed .pgrid{display:none}
.pblock.closed .phours{border-bottom:none}
.pdot{width:11px;height:11px;border-radius:3px;flex:none}
.pn{font-weight:700;font-size:14px;color:var(--ink);line-height:1.2;cursor:pointer}
.pn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pstat{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--ferie-bg);color:var(--ferie-fg);text-transform:uppercase;letter-spacing:.3px}
.staff{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:5px 10px;cursor:pointer}
.staff:hover{background:var(--surface-2)}
.staff b{color:var(--ink);font-weight:600}
.staff .jq{color:var(--muted)}
.staff .none{color:var(--red);font-weight:600}
.staff.alerte{border-color:var(--amber-bd);background:var(--amber-bg);color:var(--amber-fg)}
.staff.alerte b,.staff.alerte .jq{color:var(--amber-fg)}
.passign{border:1px solid var(--green);background:var(--surface);color:var(--green);font-family:inherit;font-weight:600;font-size:12.5px;border-radius:var(--r);height:30px;padding:0 12px;cursor:pointer}
.passign:hover{background:var(--green-soft)}
.ploc{border:1px dashed var(--sub-bd);background:var(--surface);color:var(--sub-fg);font-family:inherit;font-weight:600;font-size:12.5px;border-radius:var(--r);height:30px;padding:0 12px;cursor:pointer}
.ploc:hover{background:var(--surface-2)}
.hrs{width:132px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;flex:none}
.hrs i{display:block;height:100%;align-self:stretch}
.hrs i.done{background:var(--green)}
.hrs i.plan{background:repeating-linear-gradient(45deg,var(--green),var(--green) 2px,var(--green-soft) 2px,var(--green-soft) 5px)}
.hrs i.over{background:var(--red)}
.hm{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.hm b{color:var(--ink);font-weight:600}
.hm.st b{color:var(--sub-fg)}
.hm.tot b{color:var(--green)}
.hm em{font-style:normal;font-weight:600}
.hm em.ok{color:var(--ok)}.hm em.bad{color:var(--red)}
.pgrid{display:grid}
.pcell{min-height:54px;border-left:1px solid var(--line);border-top:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:4px}
.pcell:first-child{border-left:none}
.pcell.wkstart{border-left:2px solid var(--line-strong)}
.pcell.ferie{background:var(--ferie-bg)}
.pcell.vac{background:var(--vac-bg)}
.pcell.drop-hot{outline:2px solid var(--green);outline-offset:-2px;background:var(--green-soft)}
.wchip{background:var(--green-soft);border:1px solid var(--green-ring);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:4px;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.wchip.chef{background:var(--green);color:#fff;border-color:var(--green)}
.wchip .hw{font-size:9.5px;font-weight:700;background:var(--green);color:#fff;border-radius:999px;padding:0 5px}
.wchip.chef .hw{background:rgba(255,255,255,.28)}
.lchip{background:var(--sub-bg);border:1px dashed var(--sub-bd);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;color:var(--sub-fg);display:flex;align-items:center;gap:4px;cursor:pointer;touch-action:none;user-select:none;white-space:nowrap}
.lchip .n{background:var(--sub-fg);color:var(--surface);border-radius:999px;padding:0 5px;font-size:9.5px;font-weight:700}

/* ---------- vue mois ---------- */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:1040px}
.mh{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;padding:2px 0 4px}
.mcell{min-height:82px;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--surface)}
.mcell.blank{border:none;background:transparent}
.mcell.we{background:var(--surface-2)}
.mcell.hot{cursor:pointer}.mcell.hot:hover{border-color:var(--green-ring)}
.mcell.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.mcell.ferie{background:var(--ferie-bg);border-color:var(--ferie-bd,var(--amber-bd))}
.mcell.vac{background:var(--vac-bg)}
.mcell .md{font-weight:700;font-size:13px;color:var(--ink)}
.mcell .cap{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
.mcell .mbar{height:4px;border-radius:999px;background:var(--surface-2);margin-top:5px;overflow:hidden}.mcell .mbar i{display:block;height:100%;background:var(--green)}
.mcell .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}.mcell .dots .dot{width:7px;height:7px;border-radius:2px}
.mcell .chome{font-size:11px;font-weight:600;margin-top:4px;line-height:1.3}
.mcell.ferie .chome{color:var(--ferie-fg)}.mcell.vac .chome{color:var(--vac-fg)}

.drag-ghost{position:fixed;pointer-events:none;z-index:999;background:var(--green);color:#fff;font-weight:600;font-size:12px;padding:6px 11px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:.96}

/* ---------- panneaux modaux ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease;max-height:90vh;overflow:auto}
@media(min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:var(--r-lg);max-height:86vh;border:1px solid var(--line)}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:700;color:var(--ink)}
.sheet p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
select,input[type=text],input[type=number]{width:100%;height:40px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;padding:0 11px;-webkit-appearance:none;appearance:none}
select:focus,input:focus{outline:2px solid var(--green-ring);outline-offset:-1px}
.row2{display:flex;gap:12px}.row2>*{flex:1;min-width:0}
.dpw{position:relative}
.dpf{width:100%;min-height:40px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;font-weight:500;padding:0 11px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px}
.dpf::after{content:'';margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px)}
.dpf .mk{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--ferie-bg);color:var(--ferie-fg);white-space:nowrap}
.dp{position:absolute;z-index:80;top:calc(100% + 6px);left:0;width:272px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 12px 28px rgba(17,24,39,.14);padding:12px}
.dp.up{top:auto;bottom:calc(100% + 6px)}
.dp .nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dp .nav b{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--ink)}
.dp .nav button{width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--muted);font-size:13px;line-height:1}
.dp .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp .hd{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:2px 0;text-transform:uppercase}

<script>
const $=s=>document.querySelector(s);
const H_DEMI=4;   // heures par demi-journée

/* ---------- dates ---------- */
const JJ=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MM=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const MMLONG=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const fmtShort=d=>JJ[(d.getDay()+6)%7]+' '+d.getDate();
const fmtDate=d=>d.getDate()+' '+MM[d.getMonth()];
const fmtLong=d=>JJ[(d.getDay()+6)%7]+' '+d.getDate()+' '+MMLONG[d.getMonth()];
const TODAY=new Date(); TODAY.setHours(12,0,0,0);
const TODAY_ISO=iso(TODAY);
const nh=n=>Math.round(n).toLocaleString('fr-CA')+' h';

/* ---------- calendrier CCQ ----------
   Jours fériés chômés et payés + congés annuels obligatoires de l'industrie
   de la construction. Vérifiés sur ccq.org et apchq.com (oct. 2026).
   Ces dates bougent d'une année à l'autre — la fête du Canada 2026 tombe le
   3 juillet, pas le 1er — d'où le paramètre modifiable. */
const CCQ={
  feries:{
    2026:[['01-01',"Jour de l'An"],['04-03','Vendredi saint'],['04-06','Lundi de Pâques'],
          ['05-18','Patriotes'],['06-24','Fête nationale'],['07-03','Fête du Canada'],
          ['09-07','Fête du Travail'],['10-12','Action de grâces'],['11-13','Jour du Souvenir'],['12-25','Noël']],
    2027:[['01-01',"Jour de l'An"],['03-26','Vendredi saint'],['03-29','Lundi de Pâques'],
          ['05-24','Patriotes'],['06-24','Fête nationale'],['07-02','Fête du Canada'],
          ['09-06','Fête du Travail'],['10-11','Action de grâces'],['11-12','Jour du Souvenir'],['12-25','Noël']],
    2028:[['01-01',"Jour de l'An"],['04-14','Vendredi saint'],['04-17','Lundi de Pâques'],
          ['05-22','Patriotes'],['06-23','Fête nationale'],['06-30','Fête du Canada'],
          ['09-04','Fête du Travail'],['10-09','Action de grâces'],['11-10','Jour du Souvenir'],['12-25','Noël']],
  },
  vacances:[
    {debut:'2026-07-19',fin:'2026-08-01',nom:'Vacances estivales'},
    {debut:'2026-12-20',fin:'2027-01-02',nom:'Vacances hivernales'},
    {debut:'2027-07-25',fin:'2027-08-07',nom:'Vacances estivales'},
    {debut:'2027-12-19',fin:'2028-01-01',nom:'Vacances hivernales'},
    {debut:'2028-07-23',fin:'2028-08-05',nom:'Vacances estivales'},
    {debut:'2028-12-24',fin:'2029-01-06',nom:'Vacances hivernales'},
  ]
};
let FERIE={};
function majCCQ(){ FERIE={}; for(const y in CCQ.feries) CCQ.feries[y].forEach(([md,nom])=>FERIE[y+'-'+md]=nom); }
majCCQ();
const ferieDe=k=>FERIE[k]||null;
const vacanceDe=k=>CCQ.vacances.find(v=>k>=v.debut&&k<=v.fin)||null;
const chomeDe=k=>ferieDe(k)||(vacanceDe(k)||{}).nom||null;
const ouvrable=k=>!chomeDe(k);
function joursOuvrables(a,b){ let d=parseIso(a),e=parseIso(b),n=0;
  while(d<=e){ if(((d.getDay()+6)%7)<5) n++; d=addDays(d,1); } return n; }
let exclureChomes=true;

/* ---------- données de démonstration ----------
   budget + faites viendraient de Maestro ; cm de Ops (Somtech) ; W de Ma Place RH */
let CM=[
  {id:'c1',nom:'Jean-François Tremblay'},
  {id:'c2',nom:'Stéphane Bergeron'},
  {id:'c3',nom:'Luc Pedneault'},
];
const cmr=id=>CM.find(c=>c.id===id);
const P=[
  {id:'23-003', nom:'Camions Avantage', statut:'actif', c:'#2F7D45', budget:1240, faites:806},
  {id:'25-030', nom:'Pharmaprix Chicoutimi-Nord', statut:'actif', c:'#3A6EA5', budget:3100, faites:1124},
  {id:'24-018', nom:'Entrepôt régional', statut:'actif', c:'#7A4FA3', budget:980, faites:938},
  {id:'26-055', nom:'CDEGP Desjardins', statut:'à venir', c:'#C6820A', budget:2400, faites:0},
  {id:'ATEL', nom:'Atelier / préfab', statut:'interne', c:'#5B6472', budget:null, faites:312},
];
/* Un contremaître est affecté à un projet pour une période — c'est cette date
   de fin qui donne sa date de libération, l'information que cherche la
   planification pour savoir qui sera disponible pour le prochain chantier. */
let CMA=[];
const cmCouvre=(pid,k)=>CMA.find(a=>a.p===pid&&k>=a.debut&&k<=a.fin)||null;
const cmCourant=pid=>cmCouvre(pid,TODAY_ISO)
  ||CMA.filter(a=>a.p===pid&&a.fin>=TODAY_ISO).sort((x,y)=>x.debut<y.debut?-1:1)[0]||null;
function prochainOuvrable(d){ let x=new Date(d), g=0;
  while((((x.getDay()+6)%7)>4 || !ouvrable(iso(x))) && g++<400) x=addDays(x,1); return x; }
function libreLe(cmId){                       // null = libre dès maintenant
  const f=CMA.filter(a=>a.cm===cmId&&a.fin>=TODAY_ISO).map(a=>a.fin).sort();
  return f.length?prochainOuvrable(addDays(parseIso(f[f.length-1]),1)):null;
}
const conflitCM=(cmId,deb,fin,sauf)=>CMA.filter(a=>a.cm===cmId&&a!==sauf&&!(fin<a.debut||deb>a.fin));
function finPlanifiee(pid){
  let m=null;
  W.forEach(w=>{ for(const k in aff[w.id]){ const c=aff[w.id][k];
    if((c.am===pid||c.pm===pid)&&(!m||k>m)) m=k; } });
  for(const key in LOC){ const [pp,k]=key.split('|'); if(pp===pid&&(!m||k>m)) m=k; }
  return m;
}
const proj=id=>P.find(p=>p.id===id);
const W=[
  {id:'w1',nom:'Marc Tremblay',role:'Charpentier-chef',tel:'418-555-0112'},
  {id:'w2',nom:'Kevin Simard',role:'Charpentier',tel:'418-555-0143'},
  {id:'w3',nom:'Dave Gagné',role:'Charpentier',tel:'418-555-0190'},
  {id:'w4',nom:'Steeve Bouchard',role:'Charpentier-chef',tel:'418-555-0177'},
  {id:'w5',nom:'Yannick Côté',role:'Charpentier',tel:'418-555-0128'},
  {id:'w6',nom:'Patrick Boivin',role:'Charpentier',tel:'418-555-0165'},
  {id:'w7',nom:'Sylvain Fortin',role:'Charpentier',tel:'418-555-0154'},
  {id:'w8',nom:'Éric Lavoie',role:'Apprenti',tel:'418-555-0139'},
  {id:'w9',nom:'Mathieu Gagnon',role:'Charpentier',tel:'418-555-0186'},
];
const wrk=id=>W.find(w=>w.id===id);
const shortName=w=>{const p=w.nom.split(' ');return p[0]+' '+p[p.length-1][0]+'.';};
let crews=[
  {id:'eqA',nom:'Équipe A',chef:'w1',membres:['w1','w2','w3']},
  {id:'eqB',nom:'Équipe B',chef:'w4',membres:['w4','w5']},
];
const crewOf=wid=>crews.find(c=>c.membres.includes(wid));
const isChef=wid=>{const c=crewOf(wid);return c&&c.chef===wid;};

/* ---------- sous-traitance : location de main-d'œuvre ----------
   On loue N hommes à un sous-traitant, sur une période. Pas de nom individuel :
   la location se compte en hommes-jours, à la journée complète. */
let ST=[
  {id:'s1',nom:'Coffrages Saguenay',tel:'418-555-0301'},
  {id:'s2',nom:"Main-d'œuvre Boréal",tel:'418-555-0344'},
  {id:'s3',nom:'Charpente Express',tel:'418-555-0388'},
];
const str=id=>ST.find(x=>x.id===id);
const LOC={};                              // LOC['pid|iso'] = {stId:nbHommes}
const lkey=(p,k)=>p+'|'+k;
const locDe=(p,k)=>LOC[lkey(p,k)]||null;
function setLoc(p,k,st,nb){
  const key=lkey(p,k); if(!LOC[key])LOC[key]={};
  if(nb>0) LOC[key][st]=nb; else delete LOC[key][st];
  if(!Object.keys(LOC[key]).length) delete LOC[key];
}
function locJours(filtre){                 // jours-homme, filtre optionnel (p,k,st)
  let t=0; for(const key in LOC){ const [p,k]=key.split('|'); const m=LOC[key];
    for(const st in m){ if(!filtre||filtre(p,k,st)) t+=m[st]; } } return t;
}

/* aff[wid][iso] = {am,pm} */
const aff={}; W.forEach(w=>aff[w.id]={});
const cell=(wid,k)=>aff[wid][k]||{am:null,pm:null};
const setCell=(wid,k,v)=>{ if(!v.am&&!v.pm) delete aff[wid][k]; else aff[wid][k]={am:v.am||null,pm:v.pm||null}; };
function seed(wid,startIso,nDays,pid,half){
  let d=parseIso(startIso), n=0;
  while(n<nDays){ const dow=(d.getDay()+6)%7;
    if(dow<5){ const k=iso(d), c=cell(wid,k);
      setCell(wid,k, half==='am'?{am:pid,pm:c.pm}: half==='pm'?{am:c.am,pm:pid}:{am:pid,pm:pid}); n++; }
    d=addDays(d,1); }
}
(function demo(){
  const m0=iso(mondayOf(TODAY)), m1=iso(addDays(mondayOf(TODAY),7)), m2=iso(addDays(mondayOf(TODAY),14));
  seed('w1',m0,3,'23-003'); seed('w1',iso(addDays(parseIso(m0),3)),7,'25-030');
  seed('w2',m0,3,'23-003'); seed('w2',iso(addDays(parseIso(m0),3)),7,'25-030');
  seed('w3',m0,3,'23-003'); seed('w3',iso(addDays(parseIso(m0),3)),4,'25-030');
  seed('w4',m0,10,'25-030');
  seed('w5',m0,10,'25-030'); seed('w5',m2,5,'26-055');
  seed('w6',m0,15,'24-018');
  seed('w7',m0,2,'23-003','am'); seed('w7',m0,2,'ATEL','pm'); seed('w7',iso(addDays(parseIso(m0),2)),1,'23-003'); seed('w7',iso(addDays(parseIso(m0),3)),2,'24-018');
  seed('w8',m0,2,'ATEL'); seed('w8',iso(addDays(parseIso(m1),4)),1,'26-055','am');
  const j=(n)=>iso(addDays(TODAY,n));
  CMA=[{id:'a1',cm:'c1',p:'23-003',debut:j(-78),fin:j(59)},
       {id:'a2',cm:'c2',p:'25-030',debut:j(-36),fin:j(157)},
       {id:'a3',cm:'c3',p:'24-018',debut:j(-141),fin:j(38)}];
})();

/* heures affectées à venir : tout ce qui est planifié à partir d'aujourd'hui,
   horizon affiché ou non — sinon le chiffre changerait avec le zoom. */
function heuresAVenir(pid){
  let h=0;
  W.forEach(w=>{ for(const k in aff[w.id]){ if(k<TODAY_ISO) continue;
    const c=aff[w.id][k]; if(c.am===pid)h+=H_DEMI; if(c.pm===pid)h+=H_DEMI; } });
  return h+heuresST(pid);
}
function heuresST(pid){
  return locJours((p,k)=>p===pid&&k>=TODAY_ISO)*H_DEMI*2;
}

/* ---------- état de vue ---------- */
let view='planning', horizon=4, anchor=mondayOf(TODAY), selDay=iso(TODAY), poolMode='w';
const collapsed=new Set();   // projets dont le détail est fermé
let monthRef=new Date(TODAY.getFullYear(),TODAY.getMonth(),15,12,0,0);
const moisDe=(y,m)=>new Date(y,m,15,12,0,0);
if(((TODAY.getDay()+6)%7)>4) selDay=iso(mondayOf(addDays(TODAY,7)));

function horizonDays(){
  const out=[];
  for(let w=0;w<horizon;w++) for(let d=0;d<5;d++){
    const dt=addDays(anchor,w*7+d); out.push({k:iso(dt),d:dt,wk:w,first:d===0});
  }
  return out;
}
const halves=c=>(c.am?1:0)+(c.pm?1:0);
function stats(){
  const days=horizonDays().filter(x=>ouvrable(x.k));   // un férié n'est pas une capacité perdue
  let f=0,tot=W.length*days.length*2;
  days.forEach(x=>W.forEach(w=>f+=halves(cell(w.id,x.k))));
  const dk=new Set(horizonDays().map(x=>x.k));
  return {rate:tot?Math.round(f/tot*100):0, idle:tot-f, chomes:horizonDays().length-days.length,
          loc:locJours((p,k)=>dk.has(k))};
}
function freeFrom(wid){
  for(const x of horizonDays()){ if(!ouvrable(x.k)) continue; const c=cell(wid,x.k); if(!c.am&&!c.pm) return x.d; }
  return null;
}
function projetsDe(wids){
  const s=new Set();
  horizonDays().forEach(x=>wids.forEach(wid=>{const c=cell(wid,x.k); if(c.am)s.add(c.am); if(c.pm)s.add(c.pm);}));
  return [...s];
}
/* chefs d'équipe présents sur un projet dans l'horizon */
function chefsSur(pid){
  const out=[];
  crews.forEach(c=>{ const present=c.membres.some(m=>horizonDays().some(x=>{const cc=cell(m,x.k);return cc.am===pid||cc.pm===pid;}));
    if(present && c.chef) out.push(wrk(c.chef)); });
  return out;
}

/* ---------- glisser-déposer ---------- */
function dragify(el,payload,onTap){
  el.onpointerdown=e=>{ if(e.button&&e.button!==0)return; e.preventDefault();
    const sx=e.clientX,sy=e.clientY,pl=payload(); let started=false,hot=null,ghost=null;
    const mv=ev=>{ if(!started){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return; started=true;
        ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=pl.label;document.body.appendChild(ghost); }
      ghost.style.left=(ev.clientX+12)+'px';ghost.style.top=(ev.clientY+12)+'px';
      const t=document.elementFromPoint(ev.clientX,ev.clientY),c=t&&t.closest?t.closest('[data-drop]'):null;
      if(c!==hot){ if(hot)hot.classList.remove('drop-hot'); hot=c; if(hot)hot.classList.add('drop-hot'); } };
    const up=()=>{ window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
      if(started){ if(ghost)ghost.remove(); if(hot){ drop(hot,pl); hot.classList.remove('drop-hot'); } }
      else if(onTap) onTap(); };
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up); };
}
function drop(c,pl){ const k=c.dataset.k,pid=c.dataset.proj,half=c.dataset.half;
  if(pl.st){ const m=locDe(pid,k)||{}; setLoc(pid,k,pl.st,(m[pl.st]||0)+pl.nb); render(); return; }
  pl.wids.forEach(wid=>{ const cur=cell(wid,k);
    setCell(wid,k, half==='am'?{am:pid,pm:cur.pm}: half==='pm'?{am:cur.am,pm:pid}:{am:pid,pm:pid}); });
  render(); }

/* ---------- entête projet ---------- */
function projHeader(p){
  const av=heuresAVenir(p.id), st=heuresST(p.id), tot=p.faites+av, b=p.budget;
  const chefs=chefsSur(p.id);
  const aCM=cmCourant(p.id), cm=aCM?cmr(aCM.cm):null;
  const fp=finPlanifiee(p.id);
  const decouvert=aCM&&fp&&fp>aCM.fin;
  let bar='', ecart='';
  if(b){
    const d=Math.min(100,p.faites/b*100), a=Math.min(100-d,av/b*100), o=tot>b?Math.min(100,(tot-b)/b*100):0;
    bar=`<span class="hrs" title="Fait / planifié / budget"><i class="done" style="width:${d}%"></i><i class="plan" style="width:${a}%"></i>${o?`<i class="over" style="width:${o}%"></i>`:''}</span>`;
    const e=b-tot;
    ecart=`<em class="${e<0?'bad':'ok'}">${e<0?'dépasse de ':'reste '}${nh(Math.abs(e))}</em>`;
  }
  return `<div class="pblock-h"><div class="ph-in">
      <button class="caret" data-tog="${p.id}" title="Développer / réduire le détail">▼</button>
      <span class="pdot" style="background:${p.c}"></span>
      <span class="pn" data-tog="${p.id}">${p.id}<small>${p.nom}</small></span>
      ${p.statut!=='actif'?`<span class="pstat">${p.statut}</span>`:''}
      <span class="staff ${decouvert?'alerte':''}" data-cm="${p.id}" title="${decouvert?'Travail planifié au-delà de la fin du contremaître':'Affecter un contremaître'}">CM ${cm?`<b>${shortName(cm)}</b> <span class="jq">jusqu'au ${fmtDate(parseIso(aCM.fin))}</span>${decouvert?' ⚠':''}`:'<span class="none">à nommer</span>'}${chefs.length?` · Chef${chefs.length>1?'s':''} <b>${chefs.map(shortName).join(', ')}</b>`:''}</span>
      <button class="passign" data-proj="${p.id}">Affecter</button>
      <button class="ploc" data-proj="${p.id}">＋ Location</button>
    </div></div>
    <div class="phours"><div class="ph-in">
      ${bar}
      <span class="hm">Budget <b>${b?nh(b):'—'}</b></span>
      <span class="hm">Faites <b>${nh(p.faites)}</b></span>
      <span class="hm">À venir <b>${nh(av)}</b></span>
      ${st?`<span class="hm st">dont location <b>${nh(st)}</b></span>`:''}
      <span class="hm tot">Total <b>${nh(tot)}</b> ${ecart}</span>
    </div></div>`;
}

function renderPlanning(){
  const days=horizonDays(), n=days.length, cols=`repeat(${n},minmax(var(--col),1fr))`;
  let h=`<div class="hdr"><div class="wkrow" style="grid-template-columns:repeat(${horizon},1fr)">`;
  for(let w=0;w<horizon;w++) h+=`<div class="wk">Sem. ${fmtDate(addDays(anchor,w*7))}</div>`;
  h+=`</div><div class="dayrow" style="grid-template-columns:${cols}">`;
  days.forEach(x=>{ const fe=ferieDe(x.k), va=vacanceDe(x.k);
    h+=`<div class="dh ${x.first?'wkstart':''} ${fe?'ferie':va?'vac':x.k===TODAY_ISO?'today':''}" title="${fe||(va?va.nom:'')}">`
      +`${JJ[(x.d.getDay()+6)%7]}<small>${fmtDate(x.d)}</small>${fe?`<em>${fe}</em>`:va?`<em>Vacances</em>`:''}</div>`; });
  h+=`</div></div>`;
  P.forEach(p=>{
    h+=`<div class="pblock ${collapsed.has(p.id)?'closed':''}">`+projHeader(p)+`<div class="pgrid" style="grid-template-columns:${cols}">`;
    days.forEach(x=>{
      const mem=W.filter(w=>{const c=cell(w.id,x.k);return c.am===p.id||c.pm===p.id;});
      const chips=mem.map(w=>{const c=cell(w.id,x.k);const tag=(c.am===p.id&&c.pm===p.id)?'':(c.am===p.id?'AM':'PM');
        return `<div class="wchip ${isChef(w.id)?'chef':''}" data-chip data-w="${w.id}">${isChef(w.id)?'★ ':''}${shortName(w)}${tag?`<span class="hw">${tag}</span>`:''}</div>`;}).join('');
      h+=`<div class="pcell ${x.first?'wkstart':''} ${ferieDe(x.k)?'ferie':vacanceDe(x.k)?'vac':''}" data-drop data-proj="${p.id}" data-k="${x.k}">${chips}${locChips(p.id,x.k)}</div>`;
    });
    h+=`</div></div>`;
  });
  $('#board').innerHTML=h; wire();
}

function renderMonth(){
  const y=monthRef.getFullYear(), m=monthRef.getMonth();
  const first=new Date(y,m,1,12,0,0), lead=(first.getDay()+6)%7, last=new Date(y,m+1,0,12,0,0).getDate();
  let h='<div class="month">'+JJ.map(j=>`<div class="mh">${j}</div>`).join('');
  for(let i=0;i<lead;i++) h+=`<div class="mcell blank"></div>`;
  for(let date=1;date<=last;date++){
    const d=new Date(y,m,date,12,0,0), k=iso(d), we=((d.getDay()+6)%7)>4;
    const fe=ferieDe(k), va=vacanceDe(k);
    let body='';
    if(!we && (fe||va)){ body=`<div class="chome">${fe||va.nom}</div>`; }
    else if(!we){
      let f=0,work=0; W.forEach(w=>{const n=halves(cell(w.id,k));f+=n;if(n)work++;});
      const projs=[...new Set(W.flatMap(w=>[cell(w.id,k).am,cell(w.id,k).pm]).filter(Boolean))];
      body=`<div class="cap">${work}/${W.length} charp.</div><div class="mbar"><i style="width:${Math.round(f/(W.length*2)*100)}%"></i></div>
        <div class="dots">${projs.map(p=>`<span class="dot" style="background:${proj(p).c}"></span>`).join('')}</div>`;
    }
    h+=`<div class="mcell ${we?'we':'hot'} ${fe?'ferie':va?'vac':''} ${k===TODAY_ISO?'today':''}" ${we?'':`data-k="${k}"`}><div class="md">${date}</div>${body}</div>`;
  }
  $('#board').innerHTML=h+'</div>';
  $('#board').querySelectorAll('.mcell.hot').forEach(c=>c.onclick=()=>{
    selDay=c.dataset.k; anchor=mondayOf(parseIso(selDay)); setView('jour'); });
}
function locChips(pid,k){
  const m=locDe(pid,k); if(!m) return '';
  return Object.keys(m).map(st=>`<div class="lchip" data-loc data-p="${pid}" data-k="${k}" data-s="${st}" title="${str(st).nom} — location">${str(st).nom.length>13?str(st).nom.slice(0,12)+'…':str(st).nom}<span class="n">×${m[st]}</span></div>`).join('');
}

  $('#board').querySelectorAll('.staff').forEach(b=>b.onclick=()=>openCM(b.dataset.cm));

  $('#board').querySelectorAll('.lchip').forEach(ch=>{
    const {p:pid,k,s:st}=ch.dataset;
    dragify(ch,()=>({st:st,nb:(locDe(pid,k)||{})[st]||1,label:str(st).nom}),()=>openLocChip(pid,k,st));

  $('#board').querySelectorAll('.wchip').forEach(ch=>{
    const wid=ch.dataset.w, cl=ch.closest('.pcell');
    dragify(ch,()=>({wids:[wid],label:shortName(wrk(wid))}),()=>openChip(wid,cl.dataset.k,cl.dataset.proj));
  });
}

/* ---------- sélecteur de date ----------
   Remplace <input type="date"> : le calendrier natif ne connaît pas les congés
   CCQ, celui-ci les montre au moment où on choisit la date. La valeur reste en
   ISO dans un champ caché, donc le reste du code est inchangé. */
function dpLabel(k){
  if(!k) return 'Choisir une date';
  const d=parseIso(k), c=chomeDe(k);
  return fmtLong(d)+' '+d.getFullYear()+(c?`<span class="mk">${c}</span>`:'');
}
function dpf(id,k,pair){
  return `<div class="dpw"><button type="button" class="dpf" data-dp="${id}"${pair?` data-pair="${pair}"`:''}>${dpLabel(k)}</button><input type="hidden" id="${id}" value="${k}"></div>`;
}
let dpBox=null;
function closeDP(){ if(dpBox){ dpBox.remove(); dpBox=null; } }
document.addEventListener('click',closeDP);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDP(); });
function openDP(btn){
  const wasMine=dpBox&&dpBox.dataset.for===btn.dataset.dp;
  closeDP(); if(wasMine) return;
  const inp=$('#'+btn.dataset.dp);
  let ref=parseIso(inp.value||TODAY_ISO); ref=new Date(ref.getFullYear(),ref.getMonth(),15,12,0,0);
  const box=document.createElement('div');
  box.className='dp'; box.dataset.for=btn.dataset.dp;
  box.onclick=e=>e.stopPropagation();
  btn.parentNode.appendChild(box); dpBox=box;
  const r=btn.getBoundingClientRect();
  if(r.bottom+300>window.innerHeight && r.top>320) box.classList.add('up');
  const draw=()=>{
    const y=ref.getFullYear(), m=ref.getMonth();
    const lead=(new Date(y,m,1,12,0,0).getDay()+6)%7, last=new Date(y,m+1,0,12,0,0).getDate();
    const pr=btn.dataset.pair?$('#'+btn.dataset.pair):null;
    const a=inp.value, b=pr?pr.value:null;
    const lo=a&&b?(a<b?a:b):null, hi=a&&b?(a<b?b:a):null;
    let h=`<div class="nav"><button type="button" data-n="-1">‹</button><b>${MMLONG[m][0].toUpperCase()+MMLONG[m].slice(1)} ${y}</b><button type="button" data-n="1">›</button></div><div class="g">`
      +JJ.map(j=>`<div class="hd">${j.slice(0,2)}</div>`).join('');
    for(let i=0;i<lead;i++) h+=`<button type="button" class="d blank"></button>`;
    for(let dd=1;dd<=last;dd++){
      const dt=new Date(y,m,dd,12,0,0), k=iso(dt), w=(dt.getDay()+6)%7, ch=chomeDe(k);
      const cl=[w>4?'off':'', ferieDe(k)?'ferie':vacanceDe(k)?'vac':'', k===TODAY_ISO?'today':'',
                k===inp.value?'sel':'', (lo&&k>lo&&k<hi)?'rng':''].filter(Boolean).join(' ');
      h+=`<button type="button" class="d ${cl}" data-k="${k}" title="${ch||''}">${dd}</button>`;
    }
    h+=`</div><div class="lg"><i style="background:var(--ferie-bg)"></i>Férié CCQ &nbsp; <i style="background:var(--vac-bg)"></i>Vacances de la construction</div>`;
    box.innerHTML=h;
    box.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{
      ref=new Date(ref.getFullYear(),ref.getMonth()+ +x.dataset.n,15,12,0,0); draw(); });
    box.querySelectorAll('.d[data-k]').forEach(x=>x.onclick=()=>{
      inp.value=x.dataset.k; btn.innerHTML=dpLabel(inp.value);
      inp.dispatchEvent(new Event('input',{bubbles:true})); closeDP(); });
  };
  draw();
}

      return `<div class="wrow radio" data-c="${c.id}"><div class="wchk">✓</div><div class="wn"><b>${c.nom}</b><small>${l?'libre le '+fmtDate(l)+' '+l.getFullYear():'libre dès maintenant'}</small></div></div>`;}).join('')}</div></div>
    <div class="row2">

    if(!d||!f||f<d){ pv.className='preview warn'; pv.textContent='La date de fin doit suivre la date de début.'; $('#go').disabled=true; return; }
    const cf=conflitCM(sel,d,f);
    pv.className='preview'+(cf.length?' warn':'');
    pv.innerHTML=`<b>${cmr(sel).nom}</b> sur ${p.id}, du ${fmtLong(parseIso(d))} au ${fmtLong(parseIso(f))}`
      +`<br>Libéré le ${fmtLong(prochainOuvrable(addDays(parseIso(f),1)))} · ${joursOuvrables(d,f)} jours ouvrables`
      +(fp&&fp>f?`<br>⚠ Du travail est planifié sur ${p.id} jusqu'au ${fmtDate(parseIso(fp))} — le chantier serait sans contremaître après le ${fmtDate(parseIso(f))}.`:'')
      +(cf.length?`<br>⚠ Déjà affecté à ${cf.map(a=>a.p+' ('+fmtDate(parseIso(a.debut))+'–'+fmtDate(parseIso(a.fin))+')').join(', ')}.`:'');

function openCrew(existing){
  const ed=!!existing;
  openSheet(`<h3>${ed?existing.nom:'Monter une équipe'}</h3><p>${ed?'Modifie les membres, désigne le chef, ou dissous l\'équipe.':'Nomme l\'équipe, choisis ses charpentiers et son chef (★).'}</p>
    <div class="fld"><label>Nom</label><input type="text" id="cn" value="${ed?existing.nom:''}" placeholder="Ex. Équipe C"></div>
    <div class="fld"><label>Membres — ★ désigne le chef</label><div class="wlist" id="cl">${W.map(w=>{const c=crewOf(w.id);
      const mine=ed&&existing.membres.includes(w.id);
      return `<div class="wrow ${mine?'on':''}" data-w="${w.id}"><div class="wchk">✓</div>
        <div class="wn"><b>${w.nom}</b><small>${w.role}</small></div>
        ${c&&c!==existing?`<span class="wtag">${c.nom}</span>`:''}
        <span class="star ${ed&&existing.chef===w.id?'on':''}" data-star>★</span></div>`;}).join('')}</div></div>
    <button class="cta" id="sc">${ed?'Enregistrer':'Créer l\'équipe'}</button>
    ${ed?'<button class="opt danger" id="del" style="margin-top:10px">Dissoudre l\'équipe</button>':''}
    <button class="link" id="cx">Annuler</button>`);
  const sel=new Set(ed?existing.membres:[]); let chef=ed?existing.chef:null;
  const paint=()=>{ $('#cl').querySelectorAll('.wrow').forEach(r=>{ r.classList.toggle('on',sel.has(r.dataset.w));
    r.querySelector('[data-star]').classList.toggle('on',chef===r.dataset.w); }); };
  $('#cl').querySelectorAll('.wrow').forEach(r=>{
    r.querySelector('[data-star]').onclick=e=>{ e.stopPropagation(); const id=r.dataset.w; sel.add(id); chef=id; paint(); };
    r.onclick=()=>{ const id=r.dataset.w; if(sel.has(id)){sel.delete(id); if(chef===id)chef=null;} else sel.add(id); paint(); };
  });
  paint();
  $('#cx').onclick=close;
  if(ed) $('#del').onclick=()=>{ crews=crews.filter(c=>c!==existing); close(); render(); };
  $('#sc').onclick=()=>{ if(!sel.size)return alert('Choisis au moins un charpentier.');
    const name=$('#cn').value.trim()||('Équipe '+String.fromCharCode(65+crews.length));
    crews.forEach(c=>{ if(c!==existing) c.membres=c.membres.filter(m=>!sel.has(m)); });
    crews=crews.filter(c=>c===existing||c.membres.length>0);
    if(ed){ existing.nom=name; existing.membres=[...sel]; existing.chef=chef&&sel.has(chef)?chef:[...sel][0]; }
    else crews.push({id:'eq'+Date.now(),nom:name,chef:chef||[...sel][0],membres:[...sel]});
    close(); render(); };
}

function openLoc(pid,preset){
  preset=preset||{};
  let cible=pid||P[0].id;
  const start0=preset.start||iso(((TODAY.getDay()+6)%7)>4?mondayOf(addDays(TODAY,7)):(TODAY>=anchor?TODAY:anchor));
  openSheet(`<h3>Location de main-d'œuvre</h3><p>${pid?proj(pid).id+' — '+proj(pid).nom:'Choisis le projet, le sous-traitant et la période.'} Les hommes loués sont comptés à la journée complète.</p>
    ${pid?'':`<div class="fld"><label>Projet</label><select id="pSel">${P.map(x=>`<option value="${x.id}">${x.id} — ${x.nom}</option>`).join('')}</select></div>`}
    <div class="fld"><label>Sous-traitant</label><select id="sSel">${ST.map(x=>`<option value="${x.id}" ${preset.st===x.id?'selected':''}>${x.nom}</option>`).join('')}</select></div>
    <div class="fld"><label>Nombre d'hommes</label><input type="number" id="nb" value="${preset.nb||1}" min="1" max="50"></div>
    <div class="row2">
      <div class="fld"><label>Date de début</label>${dpf('dStart',start0,'dEnd')}</div>
      <div class="fld"><label>Date de fin</label>${dpf('dEnd',iso(addDays(parseIso(start0),11)),'dStart')}</div>
    </div>
    <div class="fld"><label>Jours de la semaine</label><div class="days-pick" id="ad">${JJ.slice(0,5).map((j,i)=>`<button data-d="${i}" class="on">${j}</button>`).join('')}</div></div>
    <div class="preview" id="pv">—</div>
    <button class="cta" id="go">Louer</button><button class="link" id="cx">Annuler</button>`);
  const dows=new Set([0,1,2,3,4]);
  function target(){
    const a=parseIso($('#dStart').value||start0), b=parseIso($('#dEnd').value||start0), out=[];
    let d=new Date(a);
    while(d<=b && out.length<400){ const w=(d.getDay()+6)%7,k=iso(d);
      if(w<5&&dows.has(w)&&(!exclureChomes||ouvrable(k))) out.push(k); d=addDays(d,1); }
    return out;
  }
  function upd(){
    if($('#pSel')) cible=$('#pSel').value;
    const days=target(), nb=Math.max(1,+$('#nb').value||1), pv=$('#pv');
    const a=parseIso($('#dStart').value||start0), b=parseIso($('#dEnd').value||start0);
    if(b<a){ pv.className='preview warn'; pv.textContent='La date de fin précède la date de début.'; $('#go').disabled=true; return; }
    if(!days.length){ pv.className='preview warn'; pv.textContent='Aucun jour ouvrable dans cette période.'; $('#go').disabled=true; return; }
    let saut=0; { let d=new Date(a); while(d<=b){ const w=(d.getDay()+6)%7,k=iso(d);
      if(w<5&&dows.has(w)&&!ouvrable(k)) saut++; d=addDays(d,1); } }
    const hrs=nb*days.length*H_DEMI*2, pr=proj(cible), dejaST=heuresST(cible);
    pv.className='preview';
    pv.innerHTML=`<b>${nb} homme${nb>1?'s':''} × ${days.length} jour${days.length>1?'s':''}</b> = ${nb*days.length} jours-homme · ${nh(hrs)}`
      +`<br>Du ${fmtLong(parseIso(days[0]))} au ${fmtLong(parseIso(days[days.length-1]))}`
      +(saut?`<br>↷ ${saut} jour${saut>1?'s':''} chômé${saut>1?'s':''} CCQ sauté${saut>1?'s':''}.`:'')
      +(pr.budget?`<br>${pr.id} : location à venir ${nh(dejaST+hrs)}, total ${nh(pr.faites+heuresAVenir(cible)+hrs)} sur ${nh(pr.budget)}`:'');
    $('#go').disabled=false; $('#go').textContent='Louer · '+(nb*days.length)+' jours-homme';
  }
  $('#ad').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d;
    dows.has(d)?(dows.delete(d),b.classList.remove('on')):(dows.add(d),b.classList.add('on')); upd(); });
  ['dStart','dEnd','nb'].forEach(id=>$('#'+id).oninput=upd);
  ['sSel','pSel'].forEach(id=>{ if($('#'+id)) $('#'+id).onchange=upd; });
  $('#cx').onclick=close;
  $('#go').onclick=()=>{ const days=target(), st=$('#sSel').value, nb=Math.max(1,+$('#nb').value||1);
    if(!days.length) return;
    days.forEach(k=>setLoc(cible,k,st,nb));
    const last=parseIso(days[days.length-1]);
    while(last>addDays(anchor,horizon*7) && horizon<12) horizon=horizon===1?2:horizon===2?4:horizon===4?8:12;
    $('#horSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.h===horizon));
    close(); render(); };
  upd();
}

    <div class="fld"><label>Ajouter une période de congé</label>

$('#btnCCQ').onclick=openCCQ;
$('#btnCMs').onclick=openCMs;

function openChip(wid,k,pid){
  const w=wrk(wid), p=proj(pid), d=parseIso(k);
  openSheet(`<h3>${w.nom}</h3><p>${fmtLong(d)} · ${p.id} ${p.nom}${isChef(wid)?' · chef de '+crewOf(wid).nom:''}</p>
    <button class="opt" data-a="jour">Journée complète sur ce projet</button>
    <button class="opt" data-a="am">Avant-midi seulement</button>
    <button class="opt" data-a="pm">Après-midi seulement</button>
    <button class="opt" data-a="ext">Prolonger sur une période…<small>Ouvre l'affectation par période, pré-remplie à partir de ce jour</small></button>
    ${crewOf(wid)?`<button class="opt" data-a="crew">Affecter toute son équipe ici…<small>${crewOf(wid).nom} — ${crewOf(wid).membres.length} personnes</small></button>`:''}
    <button class="opt danger" data-a="rem">Retirer de ce jour</button>
    <button class="opt danger" data-a="remfwd">Retirer de ce projet à partir d'ici<small>Libère tous les jours suivants de l'horizon</small></button>
    <button class="link" id="cx">Fermer</button>`);
  $('#cx').onclick=close;
  $('#sheet').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const a=b.dataset.a, c=cell(wid,k);
    if(a==='ext'){ close(); openAssign(pid,{workers:[wid],start:k}); return; }
    if(a==='crew'){ close(); openAssign(pid,{workers:crewOf(wid).membres,start:k}); return; }
    if(a==='jour') setCell(wid,k,{am:pid,pm:pid});
    else if(a==='am') setCell(wid,k,{am:pid,pm:c.pm===pid?null:c.pm});
    else if(a==='pm') setCell(wid,k,{am:c.am===pid?null:c.am,pm:pid});
    else if(a==='rem') setCell(wid,k,{am:c.am===pid?null:c.am,pm:c.pm===pid?null:c.pm});
    else { horizonDays().filter(x=>x.k>=k).forEach(x=>{const cc=cell(wid,x.k);
      setCell(wid,x.k,{am:cc.am===pid?null:cc.am,pm:cc.pm===pid?null:cc.pm});}); }
    close(); render(); });
}

/* ---------- affectation par période ---------- */
function openAssign(pid,preset){
  preset=preset||{};
  let cible=pid||P[0].id;
  const start0=preset.start||iso(((TODAY.getDay()+6)%7)>4?mondayOf(addDays(TODAY,7)):(TODAY>=anchor?TODAY:anchor));
  openSheet(`<h3>Affecter ${pid?'à '+pid:'sur un projet'}</h3><p>${pid?proj(pid).nom:'Choisis le projet, les charpentiers et la période.'}</p>
    ${pid?'':`<div class="fld"><label>Projet</label><select id="pSel">${P.map(p=>`<option value="${p.id}">${p.id} — ${p.nom}</option>`).join('')}</select></div>`}
    <div class="crewquick" id="cq">${crews.map(c=>`<button data-c="${c.id}">+ ${c.nom}</button>`).join('')}<button data-c="__all">+ Tous</button></div>
    <div class="wlist" id="wl">${W.map(w=>{const c=crewOf(w.id),ff=freeFrom(w.id);
      return `<div class="wrow" data-w="${w.id}"><div class="wchk">✓</div><div class="wn"><b>${w.nom}</b><small>${w.role} · ${ff?'libre dès '+fmtDate(ff):'complet'}</small></div>${c?`<span class="wtag">${isChef(w.id)?'★ ':''}${c.nom}</span>`:''}</div>`;}).join('')}</div>
    <div class="fld"><label>Début</label>${dpf('dStart',start0,'dEnd')}</div>
    <div class="fld"><label>Fin</label>
      <div class="seg" id="endMode" style="margin-bottom:9px"><button data-m="dur" class="on">Durée</button><button data-m="date">Jusqu'au</button></div>
      <div id="endDur" class="row2">
        <input type="number" id="dQty" value="2" min="1" max="104">
        <div class="seg" id="dUnit"><button data-u="sem" class="on">semaines</button><button data-u="jour">jours ouvr.</button></div>
      </div>
      <div id="endDate" style="display:none">${dpf('dEnd',iso(addDays(parseIso(start0),11)),'dStart')}</div>
    </div>
    <div class="fld"><label>Jours de la semaine</label><div class="days-pick" id="ad">${JJ.slice(0,5).map((j,i)=>`<button data-d="${i}" class="on">${j}</button>`).join('')}</div></div>
    <div class="fld"><label>Plage</label><div class="seg" id="am"><button data-m="jour" class="on">Journée</button><button data-m="am">AM</button><button data-m="pm">PM</button></div></div>
    <div class="preview" id="pv">—</div>
    <button class="cta" id="go">Affecter</button><button class="link" id="cx">Annuler</button>`);

  const sel=new Set(preset.workers||[]), dows=new Set([0,1,2,3,4]);
  let endMode='dur', unit='sem', mode='jour';
  const paint=()=>$('#wl').querySelectorAll('.wrow').forEach(r=>r.classList.toggle('on',sel.has(r.dataset.w)));
  paint();

  function target(){
    const s=parseIso($('#dStart').value||start0), out=[];
    if(endMode==='date'){
      const e=parseIso($('#dEnd').value); let d=new Date(s);
      while(d<=e && out.length<400){ const w=(d.getDay()+6)%7,k=iso(d);
        if(w<5&&dows.has(w)&&(!exclureChomes||ouvrable(k))) out.push(k); d=addDays(d,1); }
    } else {
      const q=Math.max(1,+$('#dQty').value||1);
      if(unit==='sem'){ const e=addDays(s,q*7-1); let d=new Date(s);
        while(d<=e){ const w=(d.getDay()+6)%7,k=iso(d);
          if(w<5&&dows.has(w)&&(!exclureChomes||ouvrable(k))) out.push(k); d=addDays(d,1); } }
      else { let d=new Date(s),n=0;
        while(n<q && out.length<400){ const w=(d.getDay()+6)%7,k=iso(d);
          if(w<5&&dows.has(w)&&(!exclureChomes||ouvrable(k))){out.push(k);n++;} d=addDays(d,1); } }
    }
    return out;
  }
  function conflicts(days){
    let n=0; sel.forEach(wid=>days.forEach(k=>{const c=cell(wid,k);
      if(mode==='jour'){ if((c.am&&c.am!==cible)||(c.pm&&c.pm!==cible)) n++; }
      else if(c[mode]&&c[mode]!==cible) n++; }));
    return n;
  }
  function upd(){
    if($('#pSel')) cible=$('#pSel').value;
    const days=target(), nw=sel.size, pv=$('#pv');
    if(!nw||!days.length){ pv.className='preview warn';
      pv.textContent=!nw?'Choisis au moins un charpentier.':'Aucun jour ouvrable dans cette période.';
      $('#go').disabled=true; $('#go').textContent='Affecter'; return; }
    const f=parseIso(days[0]), l=parseIso(days[days.length-1]), c=conflicts(days);
    let saut=0; { let d=new Date(f); while(d<=l){ const w=(d.getDay()+6)%7,k=iso(d);
      if(w<5&&dows.has(w)&&!ouvrable(k)) saut++; d=addDays(d,1); } }
    const hrs=nw*days.length*(mode==='jour'?2:1)*H_DEMI;
    const p=proj(cible), av=heuresAVenir(cible);
    pv.className='preview'+(c?' warn':'');
    pv.innerHTML=`<b>${nw} charpentier${nw>1?'s':''} × ${days.length} jour${days.length>1?'s':''}</b> = ${nh(hrs)}`
      +`<br>Du ${fmtLong(f)} au ${fmtLong(l)} · ${mode==='jour'?'journée complète':mode.toUpperCase()}`
      +(p.budget?`<br>${p.id} passerait à ${nh(p.faites+av+hrs)} sur un budget de ${nh(p.budget)}`:'')
      +(saut?`<br>${exclureChomes?'↷':'⚠'} ${saut} jour${saut>1?'s':''} chômé${saut>1?'s':''} CCQ ${exclureChomes?'sauté'+(saut>1?'s':''):'inclus dans la période'}.`:'')
      +(c?`<br>⚠ ${c} affectation${c>1?'s':''} existante${c>1?'s':''} ${c>1?'seront remplacées':'sera remplacée'}.`:'');
    $('#go').disabled=false; $('#go').textContent='Affecter · '+nh(hrs);
  }
  $('#wl').querySelectorAll('.wrow').forEach(r=>r.onclick=()=>{const id=r.dataset.w;sel.has(id)?sel.delete(id):sel.add(id);paint();upd();});
  $('#cq').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    (b.dataset.c==='__all'?W.map(w=>w.id):crews.find(c=>c.id===b.dataset.c).membres).forEach(m=>sel.add(m)); paint(); upd(); });
  if($('#pSel')) $('#pSel').onchange=upd;
  $('#endMode').querySelectorAll('button').forEach(b=>b.onclick=()=>{ endMode=b.dataset.m;
    $('#endMode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    $('#endDur').style.display=endMode==='dur'?'':'none'; $('#endDate').style.display=endMode==='date'?'':'none'; upd(); });
  $('#dUnit').querySelectorAll('button').forEach(b=>b.onclick=()=>{ unit=b.dataset.u;
    $('#dUnit').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
  $('#ad').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d;
    dows.has(d)?(dows.delete(d),b.classList.remove('on')):(dows.add(d),b.classList.add('on')); upd(); });
  $('#am').querySelectorAll('button').forEach(b=>b.onclick=()=>{ mode=b.dataset.m;
    $('#am').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
  ['dStart','dEnd','dQty'].forEach(id=>$('#'+id).oninput=upd);
  $('#cx').onclick=close;
  $('#go').onclick=()=>{ const days=target(); if(!sel.size||!days.length)return;
    sel.forEach(wid=>days.forEach(k=>{ const c=cell(wid,k);
      setCell(wid,k, mode==='jour'?{am:cible,pm:cible}: mode==='am'?{am:cible,pm:c.pm}:{am:c.am,pm:cible}); }));
    const last=parseIso(days[days.length-1]);
    while(last>addDays(anchor,horizon*7) && horizon<12) horizon=horizon===1?2:horizon===2?4:horizon===4?8:12;
    $('#horSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.h===horizon));
    close(); render(); };
  upd();
}

/* ---------- transmission ---------- */
function summary(wid){
  const days=horizonDays(), sig=k=>{ if(!ouvrable(k))return null; const c=cell(wid,k); if(!c.am&&!c.pm)return null;
    return (c.am&&c.pm&&c.am===c.pm)?c.am:((c.am||'—')+'/'+(c.pm||'—')); };
  const seg=[]; let i=0;
  while(i<days.length){ const s=sig(days[i].k);
    if(!s){ i++; continue; }
    let j=i; while(j+1<days.length && sig(days[j+1].k)===s) j++;
    seg.push([days[i].d,days[j].d,s]); i=j+1; }
  if(!seg.length) return 'Aucune affectation sur l\'horizon';
  return seg.map(s=>(s[0].getTime()===s[1].getTime()?fmtShort(s[0]):fmtShort(s[0])+'–'+fmtShort(s[1]))+' '+s[2]).join(' · ');
}
function openTx(){
  const end=addDays(anchor,horizon*7-3);
  openSheet(`<h3>Transmettre les affectations</h3><p>Du ${fmtDate(anchor)} au ${fmtDate(end)}. Choisis le canal, puis envoie à chacun son horaire.</p>
    <div class="fld"><div class="seg" id="chan"><button data-c="sms" class="on">SMS</button><button data-c="somtech">Somtech (app)</button></div></div>
    <div class="wlist" style="max-height:320px">${W.map(w=>`<div class="wrow tx-row on" data-w="${w.id}"><div class="wchk">✓</div><div class="wn"><b>${w.nom}</b><small>${summary(w.id)}</small></div><span class="txtel" data-tel>${w.tel}</span></div>`).join('')}</div>
    <button class="cta" id="send"></button><button class="link" id="cx">Annuler</button>`);
  const sel=new Set(W.map(w=>w.id)); let chan='sms';
  const upd=()=>{ $('#send').textContent='Envoyer à '+sel.size+' charpentier'+(sel.size>1?'s':'');
    $('#sheet').querySelectorAll('[data-tel]').forEach(t=>t.style.display=chan==='sms'?'':'none'); };
  $('#sheet').querySelectorAll('.tx-row').forEach(r=>r.onclick=e=>{ if(e.target.hasAttribute('data-tel'))return;
    const id=r.dataset.w; sel.has(id)?(sel.delete(id),r.classList.remove('on'),r.classList.add('off')):(sel.add(id),r.classList.add('on'),r.classList.remove('off')); upd(); });
  $('#chan').querySelectorAll('button').forEach(b=>b.onclick=()=>{chan=b.dataset.c;$('#chan').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));upd();});
  $('#cx').onclick=close; upd();
  $('#send').onclick=()=>{ if(!sel.size)return alert('Sélectionne au moins un charpentier.');
    close(); setTimeout(()=>alert('Affectations envoyées à '+sel.size+' charpentier(s) par '+(chan==='sms'?'SMS':'Somtech')+' (prototype).'),120); };
}
$('#btnTx').onclick=openTx;

render();
</script>
